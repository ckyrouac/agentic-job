# CI analysis only: topic branches are readable, but no patch can be applied.
hosts = ["github.com"]
repos = ["ckyrouac/agentic-job"]
# `*` matches only one path segment; `**` also admits topic-branch slashes.
bases = ["**"]
max_outputs = 2
max_patch_bytes = 1048576
max_patch_files = 1

[github.outputs]
# The caller pins the sole comment's destination with `comment-target`.
add_comment = { max = 1 }
